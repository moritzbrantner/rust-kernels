[package]
name = "graph-kernels"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Small deterministic graph and path-search kernels"

[dependencies]
collection-kernels = { path = "../collection-kernels" }

[dev-dependencies]
divan = "=0.1.21"
criterion = "0.5.1"

[[bench]]
name = "minimum_spanning"
harness = false

[[bench]]
name = "page_rank"
harness = false

[[bench]]
name = "topology"
harness = false

[[bench]]
name = "shortest_path"
harness = false

[[bench]]
name = "boundary_cases"
harness = false

[[bench]]
name = "optimization"
harness = false
