name: Apply materialize borrowed node

on:
  push:
    branches: [perf/materialize-borrowed-node]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/materialize-borrowed-node
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Remove materialization cursor clone
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/graph-kernels/src/topology.rs')
          text = path.read_text()
          old = '''        let node = nodes[cursor].clone();
        let outgoing_nodes = neighbors(&node).into_iter();
'''
          new = '''        let outgoing_nodes = neighbors(&nodes[cursor]).into_iter();
'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one cursor-clone sequence')
          text = text.replace(old, new)
          marker = '''        assert!(sparse.adjacency.iter().all(Vec::is_empty));
        drop(sparse);
'''
          replacement = '''        assert!(sparse.adjacency.iter().all(Vec::is_empty));
        assert_eq!(sparse_clones, NODE_COUNT);
        drop(sparse);
'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one sparse materialization assertion block')
          path.write_text(text.replace(marker, replacement))
          PY
          cargo fmt --all
      - name: Validate graph kernel
        run: |
          cargo test -p graph-kernels
          cargo clippy -p graph-kernels --all-targets -- -D warnings
          cargo bench -p graph-kernels --bench topology --no-run
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-materialize-borrowed-node.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/graph-kernels/src/topology.rs .github/workflows/apply-materialize-borrowed-node.yml
          git commit -m "perf(graph): avoid materialization cursor clone"
          git push origin HEAD:perf/materialize-borrowed-node
