name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - run: python3 scripts/validate_registry.py
      - run: python3 scripts/validate_verification_matrix.py
      - run: python3 scripts/test_standalone_registry.py
      - run: python3 scripts/test_source_registry.py
      - run: python3 scripts/test_source_contract.py
      - run: python3 scripts/test_source_update.py
      - run: python3 scripts/test_source_resolution.py
      - run: python3 scripts/test_catalog_install.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  cargo-benchmarks:
    name: Cargo-native benchmark evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Divan benchmark suites directly through Cargo
        run: |
          mkdir -p target/cargo-benchmark-evidence
          cargo bench -p geometry-kernels --bench audit_numerics -- --bench --sample-count 50 --sample-size 8 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/geometry-audit.txt
          cargo bench -p geometry-kernels --bench ray_queries -- --bench --sample-count 50 --sample-size 8 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/geometry-ray-queries.txt
          cargo bench -p statistics-kernels --bench audit_numerics -- --bench --sample-count 50 --sample-size 8 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/statistics-audit.txt
          cargo bench -p graph-kernels --bench boundary_cases -- --bench --sample-count 30 --sample-size 4 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/graph-boundary.txt
          cargo bench -p octree-kernels --bench boundary_cases -- --sample-count 30 --sample-size 4 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/octree-boundary.txt
          cargo bench -p octree-kernels --bench boundary_cases -- --audit-probe | tee target/cargo-benchmark-evidence/octree-audit.txt
          cargo bench -p search-kernels --bench boundary_cases -- --bench --sample-count 30 --sample-size 4 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/search-boundary.txt
          cargo bench -p statistics-kernels --bench boundary_cases -- --bench --sample-count 30 --sample-size 4 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/statistics-boundary.txt
          cargo bench -p similarity-kernels --bench expansion -- --bench --sample-count 32 --sample-size 1 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/similarity-expansion.txt
          cargo bench -p graph-kernels --bench optimization -- --bench --sample-count 32 --sample-size 1 --threads 1 --color never --timer os | tee target/cargo-benchmark-evidence/graph-optimization.txt
      - name: Run f64 primitive benchmark evidence
        shell: bash
        run: |
          set -euo pipefail
          cargo bench -p geometry-kernels --bench primitive3 -- --color never | tee target/cargo-benchmark-evidence/geometry-primitive3.txt
      - name: Upload raw Cargo benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cargo-benchmark-evidence-${{ github.sha }}
          path: target/cargo-benchmark-evidence/
          if-no-files-found: warn

  performance-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Callgrind
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
      - name: Install Iai-Callgrind runner
        run: cargo install iai-callgrind-runner --version 0.16.1 --locked
      - name: Run deterministic performance smoke
        env:
          PERF_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
        run: bash scripts/benchmark-smoke.sh
      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: performance-smoke-${{ github.sha }}
          path: .artifacts/performance-smoke/
          if-no-files-found: warn

  coverage-baseline:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Capture workspace coverage baseline
        run: |
          mkdir -p target/llvm-cov-baseline
          cargo llvm-cov --workspace --all-features --json --summary-only --output-path target/llvm-cov-baseline/summary.json
          cargo llvm-cov report --workspace | tee target/llvm-cov-baseline/summary.txt
          cargo llvm-cov report --workspace --lcov --output-path target/llvm-cov-baseline/lcov.info
      - name: Publish coverage summary
        if: success()
        run: |
          {
            echo '## cargo llvm-cov baseline'
            echo
            echo 'No coverage percentage or regression threshold is enforced in this slice.'
            echo
            echo '```text'
            cat target/llvm-cov-baseline/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: llvm-cov-baseline-${{ github.sha }}
          path: target/llvm-cov-baseline/
          if-no-files-found: ignore
