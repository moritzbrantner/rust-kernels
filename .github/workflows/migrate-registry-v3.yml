name: migrate registry v3

on:
  push:
    branches:
      - feat/kernel-characteristics

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kernel-characteristics
      - run: python3 scripts/migrate_registry_v3.py
      - name: Commit generated registry
        run: |
          if git diff --quiet -- registry.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add registry.json
          git commit -m "chore: migrate registry metadata to v3"
          git push origin HEAD:feat/kernel-characteristics
