name: hardening

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hardening-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: Documentation warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build public documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
