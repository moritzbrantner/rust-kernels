name: hardening

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hardening-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Declared MSRV (Rust 1.85.0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No Cargo.lock is committed, so resolve to the newest versions that still support the
      # declared rust-version instead of failing on releases that raised their MSRV.
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Compile every target and feature at the declared MSRV
        run: cargo check --workspace --all-targets --all-features
      - name: Compile the test suite at the declared MSRV
        run: cargo test --workspace --all-features --no-run

  rustdoc:
    name: Documentation warnings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "1.95.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build public documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
