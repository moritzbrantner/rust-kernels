[workspace]
members = [
    "crates/bvh-kernels",
    "crates/bvh-trace-kernels",
    "crates/collection-kernels",
    "crates/geometry-kernels",
    "crates/graph-kernels",
    "crates/noise-kernels",
    "crates/octree-kernels",
    "crates/search-kernels",
    "crates/similarity-kernels",
    "crates/spatial-kernels",
    "crates/statistics-kernels",
    "crates/web-demo",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/moritzbrantner/rust-kernels"

[workspace.lints.clippy]
# Production code must not panic through `unwrap`/`expect`; encode invariants
# in types or control flow instead. Tests may use them (see `clippy.toml`).
unwrap_used = "deny"
expect_used = "deny"
